name: CI/CD Pipeline - CloudFormation & Ansible Deploy

on:
  pull_request:
    branches: [ main, develop, feat/tvmsl ]
    paths:
      - 'tvms/**'
      - 'frontend/**'
      - 'backend/**'
  push:
    branches: [ main, develop, feat/tvmsl ]
    paths:
      - 'tvms/**'
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # FASE 1: CI (En cada PR) - Validación de sintaxis y calidad
  # -------------------------------------------------------------
  ci-validate:
    name: Lint & Sintaxis de Ansible y CloudFormation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar Python y Ansible
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de validación
        run: |
          pip install ansible ansible-lint yamllint cfn-lint

      - name: Validar sintaxis de Playbooks de Ansible
        run: |
          cd tvms/ansible
          ansible-playbook --syntax-check ping.yml
          ansible-playbook --syntax-check playbooks/01-database.yml
          ansible-playbook --syntax-check playbooks/02-backend.yml
          ansible-playbook --syntax-check playbooks/03-frontend.yml
          ansible-playbook --syntax-check site.yml

      - name: Validar sintaxis de CloudFormation
        run: |
          cfn-lint tvms/cloudformation/main.yaml tvms/cloudformation/modules/*.yaml

  # -------------------------------------------------------------
  # FASE 2: CD (Al hacer MERGE o PUSH a la rama objetivo)
  # Despliegue automático de configuración sobre los servidores EC2
  # -------------------------------------------------------------
  cd-deploy:
    name: Desplegar cambios con Ansible en AWS
    needs: ci-validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Instalar Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Configurar llave privada SSH desde GitHub Secrets
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/asistencia-devops-key.pem
          chmod 600 ~/.ssh/asistencia-devops-key.pem

      - name: Descubrir IPs de CloudFormation y armar inventario dinámico
        run: |
          cd tvms/ansible
          
          # Extraer IPs desde CloudFormation
          FRONTEND_IP=$(aws cloudformation describe-stacks --stack-name miasistencia-modular-stack --query "Stacks[0].Outputs[?OutputKey=='FrontendIP'].OutputValue" --output text)
          BACKEND_IP=$(aws cloudformation describe-stacks --stack-name miasistencia-modular-stack --query "Stacks[0].Outputs[?OutputKey=='BackendIP'].OutputValue" --output text)
          DATABASE_IP=$(aws cloudformation describe-stacks --stack-name miasistencia-modular-stack --query "Stacks[0].Outputs[?OutputKey=='DatabaseIP'].OutputValue" --output text)
          
          # Generar inventario.ini
          cat <<EOF > inventario.ini
          [frontend]
          $FRONTEND_IP

          [backend]
          $BACKEND_IP

          [database]
          $DATABASE_IP

          [all:vars]
          ansible_user=ubuntu
          ansible_ssh_private_key_file=~/.ssh/asistencia-devops-key.pem
          ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF

      - name: Configurar variables desde plantilla .example
        run: |
          cd tvms/ansible
          if [ ! -f group_vars/all.yml ]; then
            cp group_vars/all.yml.example group_vars/all.yml
            # Inyectar contraseñas reales si se configuraron en GitHub Secrets (o mantener defaults)
            if [ -n "${{ secrets.DB_PASSWORD }}" ]; then
              sed -i "s/CHANGE_ME_DB_PASSWORD/${{ secrets.DB_PASSWORD }}/" group_vars/all.yml
            fi
            if [ -n "${{ secrets.JWT_SECRET }}" ]; then
              sed -i "s/CHANGE_ME_JWT_SECRET_KEY/${{ secrets.JWT_SECRET }}/" group_vars/all.yml
            fi
            if [ -n "${{ secrets.ADMIN_PASSWORD }}" ]; then
              sed -i "s/CHANGE_ME_ADMIN_PASSWORD/${{ secrets.ADMIN_PASSWORD }}/" group_vars/all.yml
            fi
          fi

      - name: Ejecutar Ansible Playbook (Aprovisionar Servidores)
        run: |
          cd tvms/ansible
          ANSIBLE_CONFIG=./ansible.cfg ansible-playbook site.yml
