AWSTemplateFormatVersion: '2010-09-09'
Description: 'Modulo de Seguridad - Security Groups para Frontend, Backend y Database'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID de la VPC
  MiIp:
    Type: String
    Default: '0.0.0.0/0'
    Description: CIDR permitido para administracion SSH
  Proyecto:
    Type: String
    Default: 'asistencia'

Resources:
  FrontendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Security Group Frontend (${Proyecto}) - HTTP, HTTPS y SSH'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP publico
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS publico
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MiIp
          Description: SSH administracion
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Permitir salida a internet
      Tags:
        - Key: Name
          Value: !Sub '${Proyecto}-frontend-sg'
        - Key: ManagedBy
          Value: CloudFormation

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Security Group Backend (${Proyecto}) - API y SSH'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref FrontendSecurityGroup
          Description: Acceso API interno desde Frontend
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          CidrIp: 0.0.0.0/0
          Description: Acceso API publico / health check
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MiIp
          Description: SSH administracion
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Permitir salida a internet
      Tags:
        - Key: Name
          Value: !Sub '${Proyecto}-backend-sg'
        - Key: ManagedBy
          Value: CloudFormation

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Security Group Database (${Proyecto}) - MySQL/MariaDB y SSH'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref BackendSecurityGroup
          Description: Acceso MySQL interno desde Backend
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MiIp
          Description: SSH administracion
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Permitir salida a internet
      Tags:
        - Key: Name
          Value: !Sub '${Proyecto}-database-sg'
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  FrontendSecurityGroupId:
    Description: ID del Security Group de Frontend
    Value: !Ref FrontendSecurityGroup
  BackendSecurityGroupId:
    Description: ID del Security Group de Backend
    Value: !Ref BackendSecurityGroup
  DatabaseSecurityGroupId:
    Description: ID del Security Group de Database
    Value: !Ref DatabaseSecurityGroup
