AWSTemplateFormatVersion: '2010-09-09'
Description: 'Modulo de Instancia EC2 Backend (Limpia para provisionamiento Ansible)'

Parameters:
  SubnetId:
    Type: AWS::EC2::Subnet::Id
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  InstanceType:
    Type: String
    Default: 't3.small'
  Proyecto:
    Type: String
    Default: 'asistencia'
  UbuntuAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id'

Resources:
  BackendInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroupId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${Proyecto}-cfn-backend'
        - Key: Rol
          Value: backend
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  BackendInstanceId:
    Description: ID de la instancia backend
    Value: !Ref BackendInstance
  BackendPrivateIp:
    Description: IP privada de la instancia backend
    Value: !GetAtt BackendInstance.PrivateIp
  BackendPublicIp:
    Description: IP publica de la instancia backend
    Value: !GetAtt BackendInstance.PublicIp
  BackendApiUrl:
    Description: URL publica del API
    Value: !Sub 'http://${BackendInstance.PublicIp}:8000'
