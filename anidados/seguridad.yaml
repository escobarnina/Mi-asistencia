AWSTemplateFormatVersion: "2010-09-09"
Description: Stack Capa de Seguridad (Security Groups).

Parameters:
  Environment:
    Type: String

Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Permitir SSH y HTTP (${Environment})"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "asistencia-${Environment}-sg"
        - Key: Environment
          Value: !Ref Environment

Outputs:
  SecurityGroupId:
    Value: !GetAtt InstanceSecurityGroup.GroupId
